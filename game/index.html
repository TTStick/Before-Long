<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>在头发长长之前</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="boarding">
<canvas id="gl"></canvas>

<div id="topbar">
  <div id="greet"></div>
  <div id="topbtns">
    <button class="ibtn" id="btnTime" aria-label="时光"></button>
    <button class="ibtn" id="btnAlbum" aria-label="相册"></button>
    <button class="ibtn" id="btnSound" aria-label="声音"></button>
    <button class="ibtn accent" id="btnPhoto" aria-label="拍照"></button>
  </div>
</div>

<div id="prompt">
  <div id="promptText"></div>
  <div id="promptBtns">
    <button id="promptAuto">帮我梳好</button>
    <button id="promptCancel">不扎了</button>
  </div>
</div>

<div id="lenpill"></div>
<div id="toast"></div>
<div id="combCursor"></div>
<div id="braidHint"><span id="bhL">‹</span><span id="bhR">›</span></div>

<div id="tray">
  <div id="panel"></div>
  <div id="tabs"></div>
</div>

<div id="timePanel"></div>
<div id="overlay"></div>
<div id="flash"></div>

<script src="js/util.js"></script>
<script src="js/gl.js"></script>
<script src="js/art.js"></script>
<script src="js/braid.js"></script>
<script src="js/hair.js"></script>
<script src="js/scene.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
</body>
</html>
